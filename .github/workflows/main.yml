name: Generate Datas

on:
  schedule:
    # Executa automaticamente a cada 12 horas
    - cron: "0 */12 * * *"

  # Permite executar manualmente em Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Generate GitHub Contribution Snake
    runs-on: ubuntu-latest

    steps:
      # Gera a animação da Snake
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: PedroHenrique2107

          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#1976D2&color_dots=#F1F5F9,#DBEAFE,#93C5FD,#3B82F6,#0D47A1
            dist/github-contribution-grid-snake-dark.svg?color_snake=#64B5F6&color_dots=#0D1117,#0B2545,#0D47A1,#1976D2,#64B5F6

      # Publica os arquivos na branch "output"
      - uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
